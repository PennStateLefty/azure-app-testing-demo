name: UI tests

on:
  workflow_call:
    inputs:
      base_url:
        description: Base URL to test. Defaults to WEB_URL repo variable.
        required: false
        type: string
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL to test. Defaults to WEB_URL repo variable.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  ui-tests:
    name: Playwright Workspaces UI tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/playwright/package-lock.json

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Playwright tests
        working-directory: tests/playwright
        run: npm ci

      - name: Run Playwright tests in Azure App Testing
        working-directory: tests/playwright
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          PLAYWRIGHT_SERVICE_URL: ${{ vars.PLAYWRIGHT_SERVICE_URL }}
          BASE_URL: ${{ inputs.base_url || vars.WEB_URL }}
        run: npx playwright test -c playwright.service.config.ts --workers=20

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/playwright/playwright-report/**
            tests/playwright/test-results/**
          if-no-files-found: warn
