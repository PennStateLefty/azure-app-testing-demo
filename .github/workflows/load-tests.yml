name: Load tests

on:
  workflow_call:
    inputs:
      test_profile:
        description: Load test profile to run.
        required: false
        type: string
        default: smoke
      target_slot:
        description: Optional App Service deployment slot to test (for example, staging). Empty targets production.
        required: false
        type: string
        default: ''
      base_url:
        description: Optional base URL override. Defaults to the slot hostname or the WEB_URL repo variable.
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      test_profile:
        description: Load test profile to run.
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - uw
          - csr
          - peak
      target_slot:
        description: Optional App Service deployment slot to test (for example, staging). Empty targets production.
        required: false
        type: string
        default: ''
      base_url:
        description: Optional base URL override. Defaults to the slot hostname or the WEB_URL repo variable.
        required: false
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  load-tests:
    name: Azure Load Testing (${{ inputs.test_profile || 'smoke' }}${{ inputs.target_slot && format(' @ {0}', inputs.target_slot) || '' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve load test profile
        id: profile
        env:
          TEST_PROFILE: ${{ inputs.test_profile || 'smoke' }}
          WEB_URL: ${{ vars.WEB_URL }}
          BASE_URL: ${{ inputs.base_url }}
          TARGET_SLOT: ${{ inputs.target_slot }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          WEB_APP_NAME: ${{ vars.WEB_APP_NAME }}
        run: |
          set -euo pipefail
          case "$TEST_PROFILE" in
            smoke) config='loadtests/smoke.yaml' ;;
            uw) config='loadtests/underwriter-journey.yaml' ;;
            csr) config='loadtests/csr-policy-servicing.yaml' ;;
            peak) config='loadtests/mixed-peak.yaml' ;;
            *) echo "Unknown test_profile: $TEST_PROFILE" >&2; exit 1 ;;
          esac
          target_url="$BASE_URL"
          if [ -z "$target_url" ] && [ -n "$TARGET_SLOT" ]; then
            target_url="https://$(az webapp show --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$AZURE_RESOURCE_GROUP" --name "$WEB_APP_NAME" --slot "$TARGET_SLOT" --query defaultHostName -o tsv)"
          fi
          target_url="${target_url:-$WEB_URL}"
          host="${target_url#https://}"
          host="${host#http://}"
          host="${host%%/*}"
          echo "config=$config" >> "$GITHUB_OUTPUT"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "Load test target: https://$host" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve server-side metric resources
        id: metric_resources
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          WEB_APP_NAME: ${{ vars.WEB_APP_NAME }}
          WEB_APP_ID: ${{ vars.WEB_APP_ID }}
          APP_SERVICE_PLAN_ID: ${{ vars.APP_SERVICE_PLAN_ID }}
          SQL_DATABASE_ID: ${{ vars.SQL_DATABASE_ID }}
          APP_INSIGHTS_ID: ${{ vars.APP_INSIGHTS_ID }}
          TARGET_SLOT: ${{ inputs.target_slot }}
          HOST: ${{ steps.profile.outputs.host }}
        run: |
          set -euo pipefail
          web_app_name="${WEB_APP_NAME:-${HOST%%.*}}"
          web_json="$(az webapp show --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$AZURE_RESOURCE_GROUP" --name "$web_app_name" -o json)"
          web_app_id="${WEB_APP_ID:-$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$web_json")}"
          app_service_plan_id="${APP_SERVICE_PLAN_ID:-$(python3 -c 'import json,sys; print(json.load(sys.stdin)["serverFarmId"])' <<< "$web_json")}"
          sql_database_id="${SQL_DATABASE_ID:-$(az resource list --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$AZURE_RESOURCE_GROUP" --resource-type Microsoft.Sql/servers/databases --query "[?contains(name, '/master') == \`false\`] | [0].id" -o tsv)}"
          app_insights_id="${APP_INSIGHTS_ID:-$(az resource list --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$AZURE_RESOURCE_GROUP" --resource-type microsoft.insights/components --query "[0].id" -o tsv)}"
          if [ -n "$TARGET_SLOT" ]; then
            web_app_id="${web_app_id%/slots/*}/slots/$TARGET_SLOT"
          fi

          {
            echo "web_app_id=$web_app_id"
            echo "app_service_plan_id=$app_service_plan_id"
            echo "sql_database_id=$sql_database_id"
            echo "app_insights_id=$app_insights_id"
            echo "web_app_name=$(basename "$web_app_id")"
            echo "app_service_plan_name=$(basename "$app_service_plan_id")"
            echo "sql_database_name=$(basename "$sql_database_id")"
            echo "app_insights_name=$(basename "$app_insights_id")"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare load test config
        id: prepared_config
        env:
          TEST_PROFILE: ${{ inputs.test_profile || 'smoke' }}
          TARGET_SLOT: ${{ inputs.target_slot }}
          SOURCE_CONFIG: ${{ steps.profile.outputs.config }}
          WEB_APP_ID: ${{ steps.metric_resources.outputs.web_app_id }}
          WEB_APP_NAME: ${{ steps.metric_resources.outputs.web_app_name }}
          APP_SERVICE_PLAN_ID: ${{ steps.metric_resources.outputs.app_service_plan_id }}
          APP_SERVICE_PLAN_NAME: ${{ steps.metric_resources.outputs.app_service_plan_name }}
          SQL_DATABASE_ID: ${{ steps.metric_resources.outputs.sql_database_id }}
          SQL_DATABASE_NAME: ${{ steps.metric_resources.outputs.sql_database_name }}
          APP_INSIGHTS_ID: ${{ steps.metric_resources.outputs.app_insights_id }}
          APP_INSIGHTS_NAME: ${{ steps.metric_resources.outputs.app_insights_name }}
        run: |
          set -euo pipefail
          prepared="loadtests/generated-${TEST_PROFILE}${TARGET_SLOT:+-$TARGET_SLOT}.yaml"
          cp "$SOURCE_CONFIG" "$prepared"
          python3 - "$prepared" <<'PY'
          import os
          import re
          import sys

          path = sys.argv[1]
          replacements = {
              "__WEB_APP_ID__": os.environ["WEB_APP_ID"],
              "__WEB_APP_NAME__": os.environ["WEB_APP_NAME"],
              "__APP_SERVICE_PLAN_ID__": os.environ["APP_SERVICE_PLAN_ID"],
              "__APP_SERVICE_PLAN_NAME__": os.environ["APP_SERVICE_PLAN_NAME"],
              "__SQL_DATABASE_ID__": os.environ["SQL_DATABASE_ID"],
              "__SQL_DATABASE_NAME__": os.environ["SQL_DATABASE_NAME"],
              "__APP_INSIGHTS_ID__": os.environ["APP_INSIGHTS_ID"],
              "__APP_INSIGHTS_NAME__": os.environ["APP_INSIGHTS_NAME"],
          }
          text = open(path, encoding="utf-8").read()
          for placeholder, value in replacements.items():
              text = text.replace(placeholder, value)
          if os.environ.get("TARGET_SLOT"):
              # Slot metrics live under the slot resource type, not the parent site.
              text = re.sub(r"(namespace:\s*)Microsoft\.Web/sites[ \t]*$", r"\1Microsoft.Web/sites/slots", text, flags=re.MULTILINE)
          open(path, "w", encoding="utf-8").write(text)
          PY
          echo "config=$prepared" >> "$GITHUB_OUTPUT"

      - name: Run Azure Load Testing
        uses: azure/load-testing@v1
        with:
          loadtestConfigFile: ${{ steps.prepared_config.outputs.config }}
          loadtestResource: ${{ vars.LOAD_TEST_RESOURCE_NAME }}
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          env: |
            [
              {"name":"host","value":"${{ steps.profile.outputs.host }}"},
              {"name":"protocol","value":"https"}
            ]

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results-${{ inputs.test_profile || 'smoke' }}${{ inputs.target_slot && format('-{0}', inputs.target_slot) || '' }}
          path: ${{ github.workspace }}/loadTest
          if-no-files-found: warn
