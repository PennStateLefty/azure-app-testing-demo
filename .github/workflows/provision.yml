name: Provision Azure infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  provision:
    name: azd provision
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Azure Developer CLI OIDC login
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: azd auth login --client-id "$AZURE_CLIENT_ID" --federated-credential-provider github --tenant-id "$AZURE_TENANT_ID"

      - name: Select or create azd environment
        env:
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          DEPLOYMENT_MODE: ${{ vars.DEPLOYMENT_MODE }}
        run: |
          set -euo pipefail
          azd env select "$AZURE_ENV_NAME" || azd env new "$AZURE_ENV_NAME" --subscription "$AZURE_SUBSCRIPTION_ID" --location "$AZURE_LOCATION"
          azd env set AZURE_SUBSCRIPTION_ID "$AZURE_SUBSCRIPTION_ID"
          azd env set AZURE_LOCATION "$AZURE_LOCATION"
          azd env set DEPLOYMENT_MODE "${DEPLOYMENT_MODE:-githubActions}"
          echo "Note: first provision is usually run locally with azd up/provision because this identity needs Owner or User Access Administrator at subscription scope to create role assignments."

      - name: Provision
        env:
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_PRINCIPAL_ID: ${{ vars.AZURE_PRINCIPAL_ID }}
          AZURE_PRINCIPAL_NAME: ${{ vars.AZURE_PRINCIPAL_NAME }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          DEPLOYMENT_MODE: ${{ vars.DEPLOYMENT_MODE }}
        run: azd provision --no-prompt
