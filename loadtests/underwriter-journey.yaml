version: v0.1
testId: lifecore-underwriter-journey
displayName: LifeCore underwriter journey
description: KPIs, worklist paging, case workbench reads, decisions and requirement orders.
testPlan: jmeter/underwriter-journey.jmx
testType: JMX
engineInstances: 1
configurationFiles:
  - jmeter/data/cases.csv
env:
  - name: host
    value: your-app.azurewebsites.net
  - name: protocol
    value: https
  - name: port
    value: '443'
  - name: threads
    value: '50'
  - name: rampup
    value: '120'
  - name: duration
    value: '300'
  - name: thinkScale
    value: '1'
failureCriteria:
  clientMetrics:
    - avg(responseTimeMs) > 700
    - percentage(error) > 1
    - 'GET dashboard KPIs: p95(responseTimeMs) > 500'
    - 'GET worklist: p95(responseTimeMs) > 500'
    - 'GET case detail: p95(responseTimeMs) > 500'
    - 'GET risk assessment: p95(responseTimeMs) > 500'
    - 'POST decision: p95(responseTimeMs) > 800'
    - 'POST order requirement: p95(responseTimeMs) > 800'
autoStop:
  errorPercentage: 80
  timeWindow: 60

referenceIdentities:
  - kind: Metrics
    type: SystemAssigned
appComponents:
  - resourceId: "__WEB_APP_ID__"
    resourceName: "__WEB_APP_NAME__"
    kind: app
    metrics:
      - name: Requests
        namespace: Microsoft.Web/sites
        aggregation: Total
      - name: Http5xx
        namespace: Microsoft.Web/sites
        aggregation: Total
      - name: HttpResponseTime
        namespace: Microsoft.Web/sites
        aggregation: Average
      - name: CpuTime
        namespace: Microsoft.Web/sites
        aggregation: Total
      - name: MemoryWorkingSet
        namespace: Microsoft.Web/sites
        aggregation: Average
  - resourceId: "__APP_SERVICE_PLAN_ID__"
    resourceName: "__APP_SERVICE_PLAN_NAME__"
    metrics:
      - name: CpuPercentage
        namespace: Microsoft.Web/serverfarms
        aggregation: Average
      - name: MemoryPercentage
        namespace: Microsoft.Web/serverfarms
        aggregation: Average
  - resourceId: "__SQL_DATABASE_ID__"
    resourceName: "__SQL_DATABASE_NAME__"
    metrics:
      - name: cpu_percent
        namespace: Microsoft.Sql/servers/databases
        aggregation: Average
      - name: physical_data_read_percent
        namespace: Microsoft.Sql/servers/databases
        aggregation: Average
      - name: sql_instance_cpu_percent
        namespace: Microsoft.Sql/servers/databases
        aggregation: Average
      - name: connection_successful
        namespace: Microsoft.Sql/servers/databases
        aggregation: Total
      - name: deadlock
        namespace: Microsoft.Sql/servers/databases
        aggregation: Total
  - resourceId: "__APP_INSIGHTS_ID__"
    resourceName: "__APP_INSIGHTS_NAME__"
    kind: web
    metrics:
      - name: requests/duration
        namespace: microsoft.insights/components
        aggregation: Average
      - name: requests/count
        namespace: microsoft.insights/components
        aggregation: Count
      - name: requests/failed
        namespace: microsoft.insights/components
        aggregation: Count
      - name: dependencies/duration
        namespace: microsoft.insights/components
        aggregation: Average
